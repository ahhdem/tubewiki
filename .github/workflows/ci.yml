name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -e "backend[dev]"
      - name: Run tests (offline stub — no GPU/network)
        env:
          TUBEWIKI_OFFLINE: "1"
        run: pytest backend -q
