[project]
name = "tubewiki"
version = "0.1.0"
description = "Self-building wiki that distills YouTube transcripts into concept pages"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "GitPython>=3.1",
    "youtube-transcript-api>=0.6",
    "python-slugify>=8.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Whisper fallback (Phase 1 target; heavy, install on the host with the GPU):
whisper = ["faster-whisper>=1.0", "yt-dlp>=2024.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tubewiki*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
